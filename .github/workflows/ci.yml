name: CI

on:
  pull_request:
  push:
    branches: [main]

# Minimale Rechte: Die Pipeline darf den Code nur lesen.
permissions:
  contents: read

# Ein neuer Push bricht den laufenden Lauf desselben Branches ab.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hook-tests:
    name: Hook-Tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Werkzeuge installieren
        run: |
          npm ci
          python -m pip install ruff==0.16.10

      - name: Hook-Tests ausfuehren
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/hooks/test-hooks.ps1